<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>POS File Service</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 3rem auto; padding: 0 1rem; }
    section { border: 1px solid #ddd; border-radius: 8px; padding: 1rem; margin-bottom: 1rem; }
    pre { background: #f6f6f6; padding: .75rem; border-radius: 6px; overflow: auto; }
    input, button { margin: .25rem 0; }
  </style>
</head>
<body>
  <h1>POS File Service</h1>
  <p>Endpoints: <code>GET /api/file/&lt;filename&gt;</code>,
     <code>POST /api/file/upload-single</code>,
     <code>POST /api/file/upload-base64</code></p>

  <section>
    <h2>Upload a file (multipart)</h2>
    <input id="folder" value="product" placeholder="folder" />
    <input id="file" type="file" />
    <button onclick="uploadSingle()">Upload</button>
  </section>

  <section>
    <h2>Response</h2>
    <pre id="out">—</pre>
  </section>

  <script>
    const out = document.getElementById('out');
    async function uploadSingle() {
      const f = document.getElementById('file').files[0];
      if (!f) { out.textContent = 'Choose a file first.'; return; }
      const form = new FormData();
      form.append('folder', document.getElementById('folder').value || 'product');
      form.append('file', f);
      const res = await fetch('/api/file/upload-single', { method: 'POST', body: form });
      const json = await res.json();
      out.textContent = JSON.stringify(json, null, 2);
      if (json.success) {
        out.textContent += `\n\nServed at: ${location.origin}/${json.data.uri}`;
      }
    }
  </script>
</body>
</html>
