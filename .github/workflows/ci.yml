name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API
    runs-on: ubuntu-latest
    container:
      # Pinned so formatting and analysis match the Docker build toolchain.
      # Bump deliberately, together with both Dockerfiles.
      image: dart:3.13.4
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-api-${{ hashFiles('api/pubspec.yaml') }}
          restore-keys: ${{ runner.os }}-pub-api-
      - name: Install dependencies
        run: dart pub get
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze
        run: dart analyze
      - name: Test
        # Integration tests under test/integration skip themselves when no
        # server is reachable, so this run stays offline. The E2E workflow
        # (.github/workflows/e2e.yml) boots the stack and runs them for real.
        run: dart test

  file:
    name: File service
    runs-on: ubuntu-latest
    container:
      image: dart:3.13.4
    defaults:
      run:
        working-directory: file
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-file-${{ hashFiles('file/pubspec.yaml') }}
          restore-keys: ${{ runner.os }}-pub-file-
      - name: Install dependencies
        run: dart pub get
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze
        run: dart analyze
