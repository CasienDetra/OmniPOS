name: pos

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    # Loopback only: the services talk to mongo over the compose network, so
    # nothing outside this machine needs the port exposed.
    ports:
      - "127.0.0.1:${MONGO_HOST_PORT:-27017}:27017"
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "db.adminCommand('ping').ok",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  file:
    build: ./file
    restart: unless-stopped
    environment:
      PORT: "8080"
      MONGODB_URI: mongodb://mongo:27017/pos
      UPLOAD_DIR: public/uploads
    volumes:
      - file-uploads:/app/public/uploads
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "8080:8080"

  api:
    build: ./api
    restart: unless-stopped
    environment:
      PORT: "3000"
      MONGODB_URI: mongodb://mongo:27017/pos
      # No default on purpose: a placeholder secret would sign every token.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required - copy .env.example to .env and set it}
      FILE_BASE_URL: http://file:8080
    depends_on:
      mongo:
        condition: service_healthy
      file:
        condition: service_started
    ports:
      - "3000:3000"

volumes:
  mongo-data:
  file-uploads:
